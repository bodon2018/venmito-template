<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venmito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,300&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Deployed on Vercel the API is same-origin under /api; running locally the
  // backend is a separate process on port 8000. localStorage overrides both.
  window.VENMITO_API =
    localStorage.getItem("venmito_api") ||
    (location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? "http://localhost:8000"
      : "/api");
</script>
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
